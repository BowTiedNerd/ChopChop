<line x1="60.00" y1="192.00" x2="60.00" y2="228.00" stroke="#555" stroke-width="0.8" stroke-dasharray="3,2" data-dim="1"/>
<line x1="580.00" y1="192.00" x2="580.00" y2="228.00" stroke="#555" stroke-width="0.8" stroke-dasharray="3,2" data-dim="1"/>
<line x1="60.00" y1="224.00" x2="580.00" y2="224.00" stroke="#555" stroke-width="1" data-dim="1"/>
<line x1="60.00" y1="220.00" x2="60.00" y2="228.00" stroke="#555" stroke-width="1" data-dim="1"/>
<line x1="580.00" y1="220.00" x2="580.00" y2="228.00" stroke="#555" stroke-width="1" data-dim="1"/>
<rect data-patch="1" x="261.93" y="206.00" width="116.14" height="18.30" fill="#FFFFFF"/>
<text x="320.00" y="219.00" font-family="DejaVu Sans" font-size="11" fill="#222222" text-anchor="middle" data-dim="1" data-src="derivedBlanks.2.text.length"><tspan x="320.00" y="219.00">14.101&quot; (≈14 3/32&quot;)</tspan></text>
<text x="20.00" y="260.00" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="catalog.cutListAllowances.blankRule.text"><tspan x="20.00" y="260.00">Mill and rip whole blanks before any crosscut. Blank length = max(305 mm, slices x (slice + kerf) + 2 x 25</tspan><tspan x="20.00" y="274.30">mm trim). Never send a crosscut slice or piece shorter than 305 mm to the jointer or planer.</tspan></text>
<text x="20.00" y="295.60" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="label.blank.0"><tspan x="20.00" y="295.60">Walnut blank (mill &amp; rip, then crosscut 12 × 25.4 mm slices): blank 17.562&quot; (≈17 9/16&quot;) long, 1 slices of</tspan><tspan x="20.00" y="309.90">15.469&quot; (≈15 15/32&quot;) crosscut after milling.</tspan></text>
<text x="20.00" y="329.20" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="label.blank.1"><tspan x="20.00" y="329.20">Walnut blank (mill &amp; rip, then crosscut 24 × 76.2 mm slices): blank 79.062&quot; (≈79 1/16&quot;) long, 1 slices of</tspan><tspan x="20.00" y="343.50">76.969&quot; (≈76 31/32&quot;) crosscut after milling.</tspan></text>
<text x="20.00" y="362.80" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="label.blank.2"><tspan x="20.00" y="362.80">Maple blank (mill &amp; rip, then crosscut 8 × 25.4 mm slices): blank 14.101&quot; (≈14 3/32&quot;) long, 1 slices of</tspan><tspan x="20.00" y="377.10">12.008&quot; (≈12 1/64&quot;) crosscut after milling.</tspan></text>
<text x="20.00" y="396.40" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="label.blank.3"><tspan x="20.00" y="396.40">Maple blank (mill &amp; rip, then crosscut 24 × 76.2 mm slices): blank 79.062&quot; (≈79 1/16&quot;) long, 1 slices of</tspan><tspan x="20.00" y="410.70">76.969&quot; (≈76 31/32&quot;) crosscut after milling.</tspan></text>
<text x="20.00" y="430.00" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="label.blank.4"><tspan x="20.00" y="430.00">Walnut blank (mill &amp; rip, then crosscut 12 × 25.4 mm slices): blank 17.562&quot; (≈17 9/16&quot;) long, 1 slices of</tspan><tspan x="20.00" y="444.30">15.469&quot; (≈15 15/32&quot;) crosscut after milling.</tspan></text>
<text x="20.00" y="467.60" font-family="DejaVu Sans" font-size="11" fill="#222222"><tspan x="20.00" y="467.60">Blank lengths: catalog blankRule applied to the app cut list by boardviz; the app export does not apply the</tspan><tspan x="20.00" y="481.90">rule yet.</tspan></text>
<text x="20.00" y="507.20" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="catalog.steps.3.description"><tspan x="20.00" y="507.20">Plane or sand the panel flat. It is still long grain, so the planer is allowed here if the panel is no wider than</tspan><tspan x="20.00" y="521.50">12&quot; (305 mm); a wider panel goes to the router sled or drum sander.</tspan></text>
<text x="20.00" y="542.80" font-family="DejaVu Sans" font-size="11" fill="#9B1C1C" font-weight="bold" data-src="catalog.steps.3.safetyBanners.0"><tspan x="20.00" y="542.80">WARNING: Keep hands clear of the infeed and outfeed. Feed only boards at least 12&quot; (305 mm)</tspan><tspan x="20.00" y="557.10">long.</tspan></text>
</svg>
