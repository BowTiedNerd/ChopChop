<text x="20.00" y="64.00" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="catalog.steps.3.description"><tspan x="20.00" y="64.00">Plane or sand the panel flat. It is still long grain, so the planer is allowed here.</tspan></text>
