<text x="20.00" y="384.00" font-family="DejaVu Sans" font-size="11" fill="#222222"><tspan x="20.00" y="384.00">Measure fence face → near side of a tooth</tspan></text>
<text x="20.00" y="405.30" font-family="DejaVu Sans" font-size="11" fill="#222222"><tspan x="20.00" y="405.30">set toward the fence</tspan></text>
<text x="20.00" y="426.60" font-family="DejaVu Sans" font-size="11" fill="#222222"><tspan x="20.00" y="426.60">Kerf: 1/8&quot; (3.2 mm) full-kerf blade</tspan></text>
<text x="20.00" y="455.90" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="catalog.steps.0.description"><tspan x="20.00" y="455.90">Joint one face and one edge on the jointer, then plane to final thickness plus 1/8&quot; (3 mm). Rest</tspan><tspan x="20.00" y="470.20">overnight, then plane to final thickness. Take ~1/64&quot; (0.4 mm) passes for the last two passes.</tspan></text>
<text x="20.00" y="491.50" font-family="DejaVu Sans" font-size="11" fill="#222222" font-weight="bold"><tspan x="20.00" y="491.50">Final pass depth: ~1/64&quot; (0.4 mm)</tspan></text>
<text x="20.00" y="512.80" font-family="DejaVu Sans" font-size="11" fill="#9B1C1C" font-weight="bold" data-src="catalog.steps.0.safetyBanners.0"><tspan x="20.00" y="512.80">WARNING: Use push blocks on the jointer. Never joint stock shorter than 12&quot; (305 mm) or</tspan><tspan x="20.00" y="527.10">thinner than 1/2&quot; (12.5 mm).</tspan></text>
<text x="20.00" y="548.40" font-family="DejaVu Sans" font-size="11" fill="#9B1C1C" font-weight="bold" data-src="catalog.steps.0.safetyBanners.1"><tspan x="20.00" y="548.40">WARNING: Keep hands clear of the infeed and outfeed. Feed only boards at least 12&quot; (305</tspan><tspan x="20.00" y="562.70">mm) long.</tspan></text>
