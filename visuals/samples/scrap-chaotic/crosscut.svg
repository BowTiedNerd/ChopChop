<text x="20.00" y="330.00" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="catalog.steps.3.description"><tspan x="20.00" y="330.00">Crosscut slices on a crosscut sled with a stop block.</tspan></text>
<text x="20.00" y="351.30" font-family="DejaVu Sans" font-size="11" fill="#9B1C1C" font-weight="bold" data-src="catalog.steps.3.safetyBanners.0"><tspan x="20.00" y="351.30">DANGER: Never use the rip fence as a length stop for crosscuts. Use a crosscut sled with a stop</tspan><tspan x="20.00" y="365.60">block set before the blade, so the offcut is never trapped between blade and fence.</tspan></text>
<text x="20.00" y="386.90" font-family="DejaVu Sans" font-size="11" fill="#9B1C1C" font-weight="bold" data-src="catalog.steps.3.safetyBanners.1"><tspan x="20.00" y="386.90">WARNING: Do not cut pieces shorter than 6&quot; (152 mm) free-hand on the table saw. Use a sled</tspan><tspan x="20.00" y="401.20">with a hold-down.</tspan></text>
