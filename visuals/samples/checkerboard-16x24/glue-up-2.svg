<text x="20.00" y="235.72" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="catalog.steps.7.description"><tspan x="20.00" y="235.72">Glue slices into the final panel, aligning the squares at every joint. Alternate clamps above and below the</tspan><tspan x="20.00" y="250.02">panel and check for flat with a straightedge.</tspan></text>
<text x="20.00" y="271.32" font-family="DejaVu Sans" font-size="11" fill="#222222" font-weight="bold"><tspan x="20.00" y="271.32">Clamp spacing: about 8&quot; (200 mm)</tspan></text>
<text x="20.00" y="292.62" font-family="DejaVu Sans" font-size="11" fill="#9B1C1C" font-weight="bold" data-src="catalog.steps.7.safetyBanners.0"><tspan x="20.00" y="292.62">NOTE: Use a waterproof PVA glue rated for indirect food contact. Clamp until squeeze-out</tspan><tspan x="20.00" y="306.92">turns rubbery, then scrape.</tspan></text>
