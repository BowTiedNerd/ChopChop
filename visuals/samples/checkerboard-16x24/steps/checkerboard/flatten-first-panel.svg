<svg xmlns="http://www.w3.org/2000/svg" width="640" height="534" viewBox="0 0 640 534" data-figure="checkerboard/flatten-first-panel">
<rect data-bg="1" x="0" y="0" width="640" height="534" fill="#FFFFFF"/>
<text x="20.00" y="30.00" font-family="DejaVu Sans" font-size="16" fill="#222222" font-weight="bold"><tspan x="20.00" y="30.00">Checkerboard (End Grain): step 4: Flatten first panel</tspan></text>
<rect x="40.00" y="180.00" width="560.00" height="12.00" rx="0.00" fill="#7A7A7A" stroke="#222222" stroke-width="1"/>
<rect x="60.00" y="120.00" width="520.00" height="60.00" rx="0.00" fill="#5B3A29" stroke="#222222" stroke-width="1" data-machine="router-sled" data-length-mm="4103.675" data-width-mm="406.400"/>
<text x="40.00" y="84.00" font-family="DejaVu Sans" font-size="11" fill="#222222" font-weight="bold"><tspan x="40.00" y="84.00">Panel on the router sled or drum sander (schematic, not to scale)</tspan></text>
<line x1="60.00" y1="192.00" x2="60.00" y2="228.00" stroke="#555" stroke-width="0.8" stroke-dasharray="3,2" data-dim="1"/>
<line x1="580.00" y1="192.00" x2="580.00" y2="228.00" stroke="#555" stroke-width="0.8" stroke-dasharray="3,2" data-dim="1"/>
<line x1="60.00" y1="224.00" x2="580.00" y2="224.00" stroke="#555" stroke-width="1" data-dim="1"/>
<line x1="60.00" y1="220.00" x2="60.00" y2="228.00" stroke="#555" stroke-width="1" data-dim="1"/>
<line x1="580.00" y1="220.00" x2="580.00" y2="228.00" stroke="#555" stroke-width="1" data-dim="1"/>
<rect data-patch="1" x="254.93" y="206.00" width="130.14" height="18.30" fill="#FFFFFF"/>
<text x="320.00" y="219.00" font-family="DejaVu Sans" font-size="11" fill="#222222" text-anchor="middle" data-dim="1" data-src="derivedBlanks.0.text.length"><tspan x="320.00" y="219.00">161.562&quot; (≈161 9/16&quot;)</tspan></text>
<text x="20.00" y="260.00" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="catalog.cutListAllowances.blankRule.text"><tspan x="20.00" y="260.00">Mill and rip whole blanks before any crosscut. Blank length = max(305 mm, slices x (slice + kerf) + 2 x 25</tspan><tspan x="20.00" y="274.30">mm trim). Never send a crosscut slice or piece shorter than 305 mm to the jointer or planer.</tspan></text>
<text x="20.00" y="295.60" font-family="DejaVu Sans" font-size="11" fill="#9B1C1C" font-weight="bold" data-src="catalog.cutListAllowances.widthRule.text"><tspan x="20.00" y="295.60">A panel wider than the planer max width (305 mm) goes to the router sled or drum sander.</tspan><tspan x="20.00" y="309.90">Face-joint only boards no wider than the jointer max width (152 mm); wider boards get a planer</tspan><tspan x="20.00" y="324.20">sled or are flattened by hand.</tspan></text>
<text x="20.00" y="345.50" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="label.blank.0"><tspan x="20.00" y="345.50">Walnut blank (mill &amp; rip, then crosscut 108 × 33.9 mm slices): blank 161.562&quot; (≈161 9/16&quot;) long, 1 slices of</tspan><tspan x="20.00" y="359.80">159.469&quot; (≈159 15/32&quot;) crosscut after milling.</tspan></text>
<text x="20.00" y="379.10" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="label.blank.1"><tspan x="20.00" y="379.10">Maple blank (mill &amp; rip, then crosscut 108 × 33.9 mm slices): blank 161.562&quot; (≈161 9/16&quot;) long, 1 slices of</tspan><tspan x="20.00" y="393.40">159.469&quot; (≈159 15/32&quot;) crosscut after milling.</tspan></text>
<text x="20.00" y="416.70" font-family="DejaVu Sans" font-size="11" fill="#222222"><tspan x="20.00" y="416.70">Blank lengths: catalog blankRule applied to the app cut list by boardviz; the app export does not apply the</tspan><tspan x="20.00" y="431.00">rule yet.</tspan></text>
<text x="20.00" y="456.30" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="catalog.steps.3.description"><tspan x="20.00" y="456.30">Plane or sand the panel flat. It is still long grain, so the planer is allowed here if the panel is no wider than</tspan><tspan x="20.00" y="470.60">12&quot; (305 mm); a wider panel goes to the router sled or drum sander.</tspan></text>
<text x="20.00" y="491.90" font-family="DejaVu Sans" font-size="11" fill="#9B1C1C" font-weight="bold" data-src="catalog.steps.3.safetyBanners.0"><tspan x="20.00" y="491.90">WARNING: Keep hands clear of the infeed and outfeed. Feed only boards at least 12&quot; (305 mm)</tspan><tspan x="20.00" y="506.20">long.</tspan></text>
</svg>
