<text x="20.00" y="455.90" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="catalog.steps.1.description"><tspan x="20.00" y="455.90">Rip main boards and thin stripe strips. Rip stripes from a wide board with the stripe falling to the</tspan><tspan x="20.00" y="470.20">outside, away from the fence with the jointed edge against the fence. Measure from the fence face</tspan><tspan x="20.00" y="484.50">to the near side of a tooth set toward the fence.</tspan></text>
