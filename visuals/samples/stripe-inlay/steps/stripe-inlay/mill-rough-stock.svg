<svg xmlns="http://www.w3.org/2000/svg" width="634" height="545" viewBox="0 0 634 545" data-figure="stripe-inlay/mill-rough-stock">
<rect data-bg="1" x="0" y="0" width="634" height="545" fill="#FFFFFF"/>
<text x="20.00" y="30.00" font-family="DejaVu Sans" font-size="16" fill="#222222" font-weight="bold"><tspan x="20.00" y="30.00">Stripe / Inlay: step 1: Mill rough stock</tspan></text>
<rect x="40.00" y="150.00" width="560.00" height="12.00" rx="0.00" fill="#7A7A7A" stroke="#222222" stroke-width="1"/>
<rect x="60.00" y="120.00" width="520.00" height="30.00" rx="0.00" fill="#5B3A29" stroke="#222222" stroke-width="1" data-machine="jointer" data-length-mm="563.550" data-width-mm="28.200"/>
<text x="40.00" y="84.00" font-family="DejaVu Sans" font-size="11" fill="#222222" font-weight="bold"><tspan x="40.00" y="84.00">Whole blank on the jointer (schematic, not to scale)</tspan></text>
<line x1="60.00" y1="162.00" x2="60.00" y2="198.00" stroke="#555" stroke-width="0.8" stroke-dasharray="3,2" data-dim="1"/>
<line x1="580.00" y1="162.00" x2="580.00" y2="198.00" stroke="#555" stroke-width="0.8" stroke-dasharray="3,2" data-dim="1"/>
<line x1="60.00" y1="194.00" x2="580.00" y2="194.00" stroke="#555" stroke-width="1" data-dim="1"/>
<line x1="60.00" y1="190.00" x2="60.00" y2="198.00" stroke="#555" stroke-width="1" data-dim="1"/>
<line x1="580.00" y1="190.00" x2="580.00" y2="198.00" stroke="#555" stroke-width="1" data-dim="1"/>
<rect data-patch="1" x="261.93" y="176.00" width="116.14" height="18.30" fill="#FFFFFF"/>
<text x="320.00" y="189.00" font-family="DejaVu Sans" font-size="11" fill="#222222" text-anchor="middle" data-dim="1" data-src="derivedBlanks.2.text.length"><tspan x="320.00" y="189.00">22.187&quot; (≈22 3/16&quot;)</tspan></text>
<text x="20.00" y="230.00" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="catalog.cutListAllowances.blankRule.text"><tspan x="20.00" y="230.00">Mill and rip whole blanks before any crosscut. Blank length = max(305 mm, slices x (slice + kerf) + 2 x 25</tspan><tspan x="20.00" y="244.30">mm trim). Never send a crosscut slice or piece shorter than 305 mm to the jointer or planer.</tspan></text>
<text x="20.00" y="265.60" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="label.blank.0"><tspan x="20.00" y="265.60">Walnut blank (mill &amp; rip, then crosscut 5 × 457.2 mm slices): blank 94.687&quot; (≈94 11/16&quot;) long, 1 slices of</tspan><tspan x="20.00" y="279.90">92.594&quot; (≈92 19/32&quot;) crosscut after milling.</tspan></text>
<text x="20.00" y="299.20" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="label.blank.1"><tspan x="20.00" y="299.20">Maple blank (mill &amp; rip, then crosscut 5 × 457.2 mm slices): blank 94.687&quot; (≈94 11/16&quot;) long, 1 slices of</tspan><tspan x="20.00" y="313.50">92.594&quot; (≈92 19/32&quot;) crosscut after milling.</tspan></text>
<text x="20.00" y="332.80" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="label.blank.2"><tspan x="20.00" y="332.80">Walnut blank (mill &amp; rip, then crosscut 1 × 457.2 mm slices): blank 22.187&quot; (≈22 3/16&quot;) long, 1 slices of</tspan><tspan x="20.00" y="347.10">20.094&quot; (≈20 3/32&quot;) crosscut after milling.</tspan></text>
<text x="20.00" y="370.40" font-family="DejaVu Sans" font-size="11" fill="#222222"><tspan x="20.00" y="370.40">Blank lengths: catalog blankRule applied to the app cut list by boardviz; the app export does not apply the</tspan><tspan x="20.00" y="384.70">rule yet.</tspan></text>
<text x="20.00" y="410.00" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="catalog.steps.0.description"><tspan x="20.00" y="410.00">Joint one face and one edge on the jointer, then plane to final thickness plus 1/8&quot; (3 mm). Rest overnight,</tspan><tspan x="20.00" y="424.30">then plane to final thickness. Take ~1/64&quot; (0.4 mm) passes for the last two passes.</tspan></text>
<text x="20.00" y="445.60" font-family="DejaVu Sans" font-size="11" fill="#222222" font-weight="bold"><tspan x="20.00" y="445.60">Final pass depth: ~1/64&quot; (0.4 mm)</tspan></text>
<text x="20.00" y="466.90" font-family="DejaVu Sans" font-size="11" fill="#9B1C1C" font-weight="bold" data-src="catalog.steps.0.safetyBanners.0"><tspan x="20.00" y="466.90">WARNING: Use push blocks on the jointer. Never joint stock shorter than 12&quot; (305 mm) or</tspan><tspan x="20.00" y="481.20">thinner than 1/2&quot; (12.5 mm).</tspan></text>
<text x="20.00" y="502.50" font-family="DejaVu Sans" font-size="11" fill="#9B1C1C" font-weight="bold" data-src="catalog.steps.0.safetyBanners.1"><tspan x="20.00" y="502.50">WARNING: Keep hands clear of the infeed and outfeed. Feed only boards at least 12&quot; (305 mm)</tspan><tspan x="20.00" y="516.80">long.</tspan></text>
</svg>
