<text x="20.00" y="238.00" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="catalog.steps.7.description"><tspan x="20.00" y="238.00">Glue slices into the final panel, aligning the squares at every joint. Alternate clamps above</tspan><tspan x="20.00" y="252.30">and below the panel and check for flat with a straightedge.</tspan></text>
<text x="20.00" y="273.60" font-family="DejaVu Sans" font-size="11" fill="#222222" font-weight="bold"><tspan x="20.00" y="273.60">Clamp spacing: about 8&quot; (200 mm)</tspan></text>
<text x="20.00" y="294.90" font-family="DejaVu Sans" font-size="11" fill="#9B1C1C" font-weight="bold" data-src="catalog.steps.7.safetyBanners.0"><tspan x="20.00" y="294.90">NOTE: Use a waterproof PVA glue rated for indirect food contact. Clamp until</tspan><tspan x="20.00" y="309.20">squeeze-out turns rubbery, then scrape.</tspan></text>
