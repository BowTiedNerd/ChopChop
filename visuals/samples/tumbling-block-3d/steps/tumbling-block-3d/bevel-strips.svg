<text x="20.00" y="455.90" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="catalog.steps.2.description"><tspan x="20.00" y="455.90">Rip a 30° bevel on both edges to make 60° diamonds in section. Use a hold-down; the offcut side</tspan><tspan x="20.00" y="470.20">must be the outside of the blade.</tspan></text>
<text x="20.00" y="491.50" font-family="DejaVu Sans" font-size="11" fill="#222222" font-weight="bold"><tspan x="20.00" y="491.50">Blade tilt: 30°</tspan></text>
<text x="20.00" y="512.80" font-family="DejaVu Sans" font-size="11" fill="#9B1C1C" font-weight="bold" data-src="catalog.steps.2.safetyBanners.0"><tspan x="20.00" y="512.80">WARNING: Use the riving knife and blade guard on every through cut.</tspan></text>
<text x="20.00" y="534.10" font-family="DejaVu Sans" font-size="11" fill="#9B1C1C" font-weight="bold" data-src="catalog.steps.2.safetyBanners.1"><tspan x="20.00" y="534.10">WARNING: Use a push stick for any rip narrower than 6&quot; (152 mm). Never reach over or</tspan><tspan x="20.00" y="548.40">behind the blade.</tspan></text>
<text x="20.00" y="569.70" font-family="DejaVu Sans" font-size="11" fill="#9B1C1C" font-weight="bold" data-src="catalog.steps.2.safetyBanners.2"><tspan x="20.00" y="569.70">WARNING: Make angled cuts on a sled or miter gauge with a hold-down, never against</tspan><tspan x="20.00" y="584.00">the rip fence alone.</tspan></text>
