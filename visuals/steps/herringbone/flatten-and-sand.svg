<text x="20.00" y="604.50" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="catalog.steps.7.description"><tspan x="20.00" y="604.50">Scrape glue, then plane flat if the panel is no wider than 12&quot; (305 mm), otherwise use the router sled</tspan><tspan x="20.00" y="618.80">or drum sander. Sand 80, 120, 180 grit. Break edges (180 grit).</tspan></text>
