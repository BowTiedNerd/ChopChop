<text x="20.00" y="30.00" font-family="DejaVu Sans" font-size="16" fill="#222222" font-weight="bold"><tspan x="20.00" y="30.00">Brick / Basketweave (End Grain): step 1: Mill rough stock</tspan></text>
<rect x="40.00" y="150.00" width="560.00" height="12.00" rx="0.00" fill="#7A7A7A" stroke="#222222" stroke-width="1"/>
<rect x="60.00" y="120.00" width="520.00" height="30.00" rx="0.00" fill="#5B3A29" stroke="#222222" stroke-width="1" data-machine="jointer" data-length-mm="704.000" data-width-mm="85.375"/>
<text x="40.00" y="84.00" font-family="DejaVu Sans" font-size="11" fill="#222222" font-weight="bold"><tspan x="40.00" y="84.00">Whole blank on the jointer (schematic, not to scale)</tspan></text>
<line x1="60.00" y1="162.00" x2="60.00" y2="198.00" stroke="#555" stroke-width="0.8" stroke-dasharray="3,2" data-dim="1"/>
<line x1="580.00" y1="162.00" x2="580.00" y2="198.00" stroke="#555" stroke-width="0.8" stroke-dasharray="3,2" data-dim="1"/>
<line x1="60.00" y1="194.00" x2="580.00" y2="194.00" stroke="#555" stroke-width="1" data-dim="1"/>
<line x1="60.00" y1="190.00" x2="60.00" y2="198.00" stroke="#555" stroke-width="1" data-dim="1"/>
<line x1="580.00" y1="190.00" x2="580.00" y2="198.00" stroke="#555" stroke-width="1" data-dim="1"/>
<rect data-patch="1" x="258.43" y="176.00" width="123.14" height="18.30" fill="#FFFFFF"/>
<text x="320.00" y="189.00" font-family="DejaVu Sans" font-size="11" fill="#222222" text-anchor="middle" data-dim="1" data-src="derivedBlanks.2.text.length"><tspan x="320.00" y="189.00">27.717&quot; (≈27 23/32&quot;)</tspan></text>
<text x="20.00" y="230.00" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="catalog.cutListAllowances.blankRule.text"><tspan x="20.00" y="230.00">Mill and rip whole blanks before any crosscut. Blank length = max(305 mm, slices x (slice + kerf) + 2 x 25</tspan><tspan x="20.00" y="244.30">mm trim). Never send a crosscut slice or piece shorter than 305 mm to the jointer or planer.</tspan></text>
<text x="20.00" y="265.60" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="label.blank.0"><tspan x="20.00" y="265.60">Walnut strip: blank 40.591&quot; (≈40 19/32&quot;) long, 12 slices of 3.094&quot; (≈3 3/32&quot;) crosscut after milling.</tspan></text>
<text x="20.00" y="284.90" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="label.blank.1"><tspan x="20.00" y="284.90">Walnut strip: blank 127.213&quot; (≈127 7/32&quot;) long, 24 slices of 5.094&quot; (≈5 3/32&quot;) crosscut after milling.</tspan></text>
<text x="20.00" y="304.20" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="label.blank.2"><tspan x="20.00" y="304.20">Maple strip: blank 27.717&quot; (≈27 23/32&quot;) long, 8 slices of 3.094&quot; (≈3 3/32&quot;) crosscut after milling.</tspan></text>
<text x="20.00" y="323.50" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="label.blank.3"><tspan x="20.00" y="323.50">Maple strip: blank 127.213&quot; (≈127 7/32&quot;) long, 24 slices of 5.094&quot; (≈5 3/32&quot;) crosscut after milling.</tspan></text>
<text x="20.00" y="342.80" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="label.blank.4"><tspan x="20.00" y="342.80">Walnut strip: blank 40.591&quot; (≈40 19/32&quot;) long, 12 slices of 3.094&quot; (≈3 3/32&quot;) crosscut after milling.</tspan></text>
<text x="20.00" y="366.10" font-family="DejaVu Sans" font-size="11" fill="#222222"><tspan x="20.00" y="366.10">Blank lengths: catalog blankRule applied to the app cut list by boardviz; the app export does not apply the</tspan><tspan x="20.00" y="380.40">rule yet.</tspan></text>
<text x="20.00" y="405.70" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="catalog.steps.0.description"><tspan x="20.00" y="405.70">Joint one face and one edge on the jointer, then plane to final thickness plus 1/8&quot; (3 mm). Rest overnight,</tspan><tspan x="20.00" y="420.00">then plane to final thickness. Take ~1/64&quot; (0.4 mm) passes for the last two passes.</tspan></text>
<text x="20.00" y="441.30" font-family="DejaVu Sans" font-size="11" fill="#222222" font-weight="bold"><tspan x="20.00" y="441.30">Final pass depth: ~1/64&quot; (0.4 mm)</tspan></text>
<text x="20.00" y="462.60" font-family="DejaVu Sans" font-size="11" fill="#9B1C1C" font-weight="bold" data-src="catalog.steps.0.safetyBanners.0"><tspan x="20.00" y="462.60">WARNING: Use push blocks on the jointer. Never joint stock shorter than 12&quot; (305 mm) or</tspan><tspan x="20.00" y="476.90">thinner than 1/2&quot; (12.5 mm).</tspan></text>
<text x="20.00" y="498.20" font-family="DejaVu Sans" font-size="11" fill="#9B1C1C" font-weight="bold" data-src="catalog.steps.0.safetyBanners.1"><tspan x="20.00" y="498.20">WARNING: Keep hands clear of the infeed and outfeed. Feed only boards at least 12&quot; (305 mm)</tspan><tspan x="20.00" y="512.50">long.</tspan></text>
</svg>
