<text x="320.00" y="219.00" font-family="DejaVu Sans" font-size="11" fill="#222222" text-anchor="middle" data-dim="1" data-src="derivedBlanks.2.text.length"><tspan x="320.00" y="219.00">27.717&quot; (≈27 23/32&quot;)</tspan></text>
<text x="20.00" y="260.00" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="catalog.cutListAllowances.blankRule.text"><tspan x="20.00" y="260.00">Mill and rip whole blanks before any crosscut. Blank length = max(305 mm, slices x (slice + kerf) + 2 x 25</tspan><tspan x="20.00" y="274.30">mm trim). Never send a crosscut slice or piece shorter than 305 mm to the jointer or planer.</tspan></text>
<text x="20.00" y="295.60" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="label.blank.0"><tspan x="20.00" y="295.60">Walnut strip: blank 40.591&quot; (≈40 19/32&quot;) long, 12 slices of 3.094&quot; (≈3 3/32&quot;) crosscut after milling.</tspan></text>
<text x="20.00" y="314.90" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="label.blank.1"><tspan x="20.00" y="314.90">Walnut strip: blank 127.213&quot; (≈127 7/32&quot;) long, 24 slices of 5.094&quot; (≈5 3/32&quot;) crosscut after milling.</tspan></text>
<text x="20.00" y="334.20" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="label.blank.2"><tspan x="20.00" y="334.20">Maple strip: blank 27.717&quot; (≈27 23/32&quot;) long, 8 slices of 3.094&quot; (≈3 3/32&quot;) crosscut after milling.</tspan></text>
<text x="20.00" y="353.50" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="label.blank.3"><tspan x="20.00" y="353.50">Maple strip: blank 127.213&quot; (≈127 7/32&quot;) long, 24 slices of 5.094&quot; (≈5 3/32&quot;) crosscut after milling.</tspan></text>
<text x="20.00" y="372.80" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="label.blank.4"><tspan x="20.00" y="372.80">Walnut strip: blank 40.591&quot; (≈40 19/32&quot;) long, 12 slices of 3.094&quot; (≈3 3/32&quot;) crosscut after milling.</tspan></text>
<text x="20.00" y="396.10" font-family="DejaVu Sans" font-size="11" fill="#222222"><tspan x="20.00" y="396.10">Blank lengths: catalog blankRule applied to the app cut list by boardviz; the app export does not apply the</tspan><tspan x="20.00" y="410.40">rule yet.</tspan></text>
<text x="20.00" y="435.70" font-family="DejaVu Sans" font-size="11" fill="#222222" data-src="catalog.steps.3.description"><tspan x="20.00" y="435.70">Plane or sand the panel flat. It is still long grain, so the planer is allowed here if the panel is no wider than</tspan><tspan x="20.00" y="450.00">12&quot; (305 mm); a wider panel goes to the router sled or drum sander.</tspan></text>
<text x="20.00" y="471.30" font-family="DejaVu Sans" font-size="11" fill="#9B1C1C" font-weight="bold" data-src="catalog.steps.3.safetyBanners.0"><tspan x="20.00" y="471.30">WARNING: Keep hands clear of the infeed and outfeed. Feed only boards at least 12&quot; (305 mm)</tspan><tspan x="20.00" y="485.60">long.</tspan></text>
</svg>
