name: CI

on:
  push:
    branches: [ main, cursor/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Type check
      run: npx tsc --noEmit
    
    - name: Lint
      run: npm run lint
    
    - name: Build
      run: npm run build
    
    - name: Run tests
      run: npm test -- --run --reporter=verbose
      env:
        ALLOW_FALLBACK_FIGURES: true
        SKIP_BROWSER_TESTS: true
    
    - name: Generate samples
      run: npm run generate-samples
      env:
        ALLOW_FALLBACK_FIGURES: true
    
    - name: Run boardviz tests
      run: |
        if [ -f visuals/requirements.txt ]; then
          echo "Installing Python dependencies..."
          cd visuals && pip install -r requirements.txt
          python3 -m unittest test_boardviz -v
        elif [ -f visuals/test_boardviz.py ]; then
          echo "Skipping boardviz tests (requirements.txt not found)"
        else
          echo "Skipping boardviz tests (test_boardviz.py not found)"
        fi
    
    - name: Run boardviz strict mode
      run: |
        python3 -m pip install --user Pillow
        cd visuals && CHOPCHOP_DIR=/home/runner/work/ChopChop/ChopChop python3 boardviz.py all --out /tmp/boardviz-test --strict
    
    - name: Verify metric sample export
      run: |
        if [ -f visuals/samples/metric/agreement.json ]; then
          echo "Checking metric sample agreement..."
          cd visuals/samples/metric
          if ! python3 -c "import json; d=json.load(open('agreement.json')); exit(0 if d.get('ok') and d.get('freshExportIdentical') and len(d.get('exportVsCatalog',[]))==0 else 1)"; then
            echo "FAIL: Metric sample has issues"
            cat agreement.json
            exit 1
          fi
          echo "Metric sample verified"
        fi
    
    - name: Check agreement.json (all samples must agree with export)
      run: |
        cd visuals
        VIOLATIONS=0
        for sample in samples/*/agreement.json; do
          if [ -f "$sample" ]; then
            echo "Checking $sample..."
            # Check ok and freshExportIdentical
            if ! python3 -c "import json; d=json.load(open('$sample')); exit(0 if d.get('ok') and d.get('freshExportIdentical') else 1)"; then
              echo "FAIL: $sample has issues"
              cat "$sample"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
            # Check exportVsCatalog (warn only until visuals-draft2 with blankRule-compliant exports)
            if ! python3 -c "import json; d=json.load(open('$sample')); evs=d.get('exportVsCatalog',[]); exit(0 if len(evs)==0 else 1)"; then
              echo "WARNING: $sample has exportVsCatalog discrepancies (will be fixed in visuals-draft2):"
              python3 -c "import json; d=json.load(open('$sample')); print('\\n'.join(d.get('exportVsCatalog',[])))"
              # Uncomment when visuals-draft2 arrives: VIOLATIONS=$((VIOLATIONS + 1))
            fi
          fi
        done
        if [ $VIOLATIONS -gt 0 ]; then
          echo "Total violations: $VIOLATIONS"
          exit 1
        fi
        echo "All agreement.json checks passed (exportVsCatalog warnings expected until visuals-draft2)"
